[project]
extra_css = ['stylesheets/shiki.css']
extra_javascript = ['javascripts/shiki.mjs']
site_description = 'Inspect, test, snapshot, and watch MCP servers from the command line.'
site_name = 'mcpdev'

[project.markdown_extensions]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.superfences]
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-bash'
format = 'pymdownx.superfences.fence_code_format'
name = 'bash'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-sh'
format = 'pymdownx.superfences.fence_code_format'
name = 'sh'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-shell'
format = 'pymdownx.superfences.fence_code_format'
name = 'shell'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-go'
format = 'pymdownx.superfences.fence_code_format'
name = 'go'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-yaml'
format = 'pymdownx.superfences.fence_code_format'
name = 'yaml'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-yml'
format = 'pymdownx.superfences.fence_code_format'
name = 'yml'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-json'
format = 'pymdownx.superfences.fence_code_format'
name = 'json'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-toml'
format = 'pymdownx.superfences.fence_code_format'
name = 'toml'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-markdown'
format = 'pymdownx.superfences.fence_code_format'
name = 'markdown'

[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
class = 'language-text'
format = 'pymdownx.superfences.fence_code_format'
name = 'text'

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true

[[project.nav]]
Home = 'index.md'

[[project.nav]]
[[project.nav.Guides]]
'Stdio servers' = 'guides/stdio.md'

[[project.nav.Guides]]
'Streamable HTTP' = 'guides/http.md'

[[project.nav.Guides]]
'Inspect a server' = 'guides/inspect.md'

[[project.nav.Guides]]
'Call, prompt, and read' = 'guides/operations.md'

[[project.nav.Guides]]
'Protocol tracing' = 'guides/tracing.md'

[[project.nav.Guides]]
'Snapshots and diffs' = 'guides/snapshots-and-diffs.md'

[[project.nav.Guides]]
'Declarative tests' = 'guides/testing.md'

[[project.nav.Guides]]
'Replay fixtures' = 'guides/replay.md'

[[project.nav.Guides]]
'Watch and rebuild' = 'guides/watch.md'

[[project.nav.Guides]]
'GitHub Actions' = 'guides/github-actions.md'

[[project.nav.Guides]]
'AI agents' = 'guides/ai-agents.md'

[[project.nav.Guides]]
Troubleshooting = 'guides/troubleshooting.md'

[[project.nav]]
[[project.nav.Tutorials]]
'Stdio developer loop' = 'tutorials/stdio-loop.md'

[[project.nav]]
[[project.nav.Reference]]
Installation = 'reference/installation.md'

[[project.nav.Reference]]
Compatibility = 'reference/compatibility.md'

[[project.nav.Reference]]
CLI = 'reference/cli.md'

[[project.nav.Reference]]
Configuration = 'reference/configuration.md'

[[project.nav.Reference]]
Diagnostics = 'reference/diagnostics.md'

[[project.nav.Reference]]
Inventory = 'reference/inventory.md'

[[project.nav.Reference]]
'Snapshot format' = 'reference/snapshot-format.md'

[[project.nav.Reference]]
'Interface diffs' = 'reference/diff-policy.md'

[[project.nav.Reference]]
'Scenario format' = 'reference/scenario-format.md'

[[project.nav]]
[[project.nav.Contributing]]
'Test fixtures' = 'contributing/testing.md'

[[project.nav.Contributing]]
'Official conformance' = 'contributing/conformance.md'

[project.theme]
features = ['content.code.copy', 'navigation.instant', 'navigation.sections']
language = 'en'
variant = 'modern'
