name: Official MCP conformance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cache Go build data
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # Scheduled runs start cold, so warm the cache once instead of letting
      # every go run and go build step fetch the same modules.
      - name: Download Go modules
        run: go mod download
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # The action fetches the prebuilt binary for this platform and caches
      # it, skipping a compile of golangci-lint and its dependency tree.
      # install-only leaves the run itself to xdrun.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: binary
          install-only: true
          verify: false
      # gosec publishes release tarballs but no setup action, and govulncheck
      # publishes no release assets at all, so both compile from source under a
      # pin. The module cache makes that a cost only when a pin moves.
      - name: Cache Go-installed tools
        id: tools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ env.GOSEC_VERSION }}-${{ env.GOVULNCHECK_VERSION }}
      - name: Install Go-installed tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Set up xdrun
        uses: phillarmonic/setup-drun@v2
        with:
          version: v2
      - run: xdrun conformance
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance-results
          path: artifacts/conformance/
          if-no-files-found: warn
