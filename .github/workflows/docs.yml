name: Documentation

# A merge into master is what publishes the site. The pull-request gate in
# ci.yml already runs the same strict build, so this workflow only republishes
# what a reviewed commit produced.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Two merges in quick succession would otherwise race to upload a Pages
# artifact. Cancelling the older run leaves the newest commit as the site.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # --locked keeps the site build identical to a laptop run. --strict is
      # the flag `xdrun docs:build` passes, so a broken link or an unlisted
      # page fails here instead of publishing.
      - name: Sync documentation dependencies
        run: uv sync --locked --group dev
      - name: Build documentation
        run: uv run zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
